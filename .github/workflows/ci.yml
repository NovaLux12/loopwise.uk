name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint HTML
        run: npx html-validate index.html build.html research.html
      - name: Lint CSS
        run: npx stylelint "styles.css" "css/*.css"
      - name: Check internal links and anchors
        run: node scripts/check-links.mjs
